<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Goal</title>
</head>
<body>
    <h1>Delete Goal</h1>

    <p>Are you sure you want to delete "{{ goal.title }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
    </form>

    <a href="{% url 'goals:page' %}">Cancel</a>
</body>
</html>
